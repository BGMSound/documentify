name: maven central 퍼블리싱
on:
  push:
    branches:
      - main
jobs:
  publish-to-mavencentral:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub 리포지토리 체크아웃
        uses: actions/checkout@v4
      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_SECRET }}
          passphrase: ${{ secrets.PASSPHRASE }}
          trust_level: 5
      - name: Gradle 애드온 준비하기
        uses: gradle/gradle-build-action@v2
      - name: 빌드 및 퍼블리싱
        env:
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "export GPG_TTY=$(tty)" >> ~/.bashrc
          source ~/.bashrc
    
          echo mavenCentralUsername=$MAVEN_CENTRAL_USERNAME >>! gradle.properties
          echo mavenCentralPassword=$MAVEN_CENTRAL_PASSWORD >>! gradle.properties
          ./gradlew --stacktrace publish