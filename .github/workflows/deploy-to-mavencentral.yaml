name: maven central 퍼블리싱
on:
  push:
    branches:
      - main
jobs:
  publish-to-mavencentral:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub 리포지토리 체크아웃
        uses: actions/checkout@v4
      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --passphrase-fd 0 --pinentry-mode loopback --list-secret-keys
      - name: Gradle 애드온 준비하기
        uses: gradle/gradle-build-action@v2
      - name: 빌드 및 퍼블리싱
        env:
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          chmod +x gradlew
          export GPG_TTY=$(tty)
          echo mavenCentralUsername=$MAVEN_CENTRAL_USERNAME >>! gradle.properties
          echo mavenCentralPassword=$MAVEN_CENTRAL_PASSWORD >>! gradle.properties
          ./gradlew --stacktrace publish