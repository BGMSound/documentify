name: 릴리스
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: release
jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      project-version: ${{ steps.verify.outputs.project-version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - name: GitHub 리포지토리 체크아웃
        uses: actions/checkout@v6
      - name: 태그와 프로젝트 버전 일치 확인
        id: verify
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(grep -E '^project\.version\.id=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "tag version is $TAG_VERSION, project version is $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) does not match project.version.id ($PROJECT_VERSION)"
            exit 1
          fi
          if [[ "$PROJECT_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::SNAPSHOT version cannot be released"
            exit 1
          fi
          if [[ "$PROJECT_VERSION" =~ -(M|RC)[0-9]+$ ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "project-version=$PROJECT_VERSION" >> $GITHUB_OUTPUT
  publish-to-mavencentral:
    needs: [ verify-version ]
    uses: ./.github/workflows/deploy-to-mavencentral.yaml
    secrets:
      GPG_SECRET: ${{ secrets.GPG_SECRET }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  create-github-release:
    needs: [ verify-version, publish-to-mavencentral ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Release 초안 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify-version.outputs.prerelease }}
        run: |
          FLAGS="--draft --generate-notes --verify-tag"
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" $FLAGS
